<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Student Enrollment System</title>
</head>
<body>
    <div class="box">
        <img src="https://www.uc-bcf.edu.ph/assets/images/uc_logo_white_ext_h150.png" alt="School Logo">
        <form class="forms" id="enrollForm" novalidate>
            <div class="form-group">
                <label for="sID">Student ID:</label>
                <input type="text" id="sID" name="sID" placeholder="Student ID" minlength="5" required><br>
            </div>
            <div class="form-group">
                <label for="prefix">Prefix:</label>
                <input type="text" id="prefix" name="prefix" placeholder="Prefix" minlength="2"><br>
            </div>
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" placeholder="First Name" minlength="3" required><br>
            </div>
            <div class="form-group">
                <label for="middleName">Middle Name:</label>
                <input type="text" id="middleName" name="middleName" placeholder="Middle Name" minlength="2" required><br>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" placeholder="Last Name" minlength="2" required><br>
            </div>
            <div class="form-group">
                <label for="suffix">Suffix:</label>
                <input type="text" id="suffix" name="suffix" placeholder="Suffix" minlength="2"><br>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" required><br>
            </div>
            <div class="form-group">
                <label for="course">Course:</label>
                <select id="course" name="course" required>
                    <optgroup label="BSIT">
                        <option value="netsec">Net Sec</option>
                        <option value="webtech">Web Tech</option>
                        <option value="erp">ERP</option>
                    </optgroup>
                    <option value="BSCS">BSCS</option>
                    <option value="BMMA">BMMA</option>
                    <option value="BSAIS">BSAIS</option>
                </select><br>
            </div>
            <div class="form-group">
                <label for="yearLevel">Year Level:</label>
                <select id="yearLevel" name="yearLevel" required>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                </select><br>
            </div>
            <input type="submit" value="Submit">
        </form>

        <p class="success-message" id="successMessage" hidden></p>

        <div class="table-wrap" id="resultsWrap" hidden>
            <h3>Enrolled Students</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Year Level</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </div>
</body>
</html>
